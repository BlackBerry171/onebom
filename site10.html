<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel FF111</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial,sans-serif;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('https://i.imgur.com/9n4J3lD.jpeg');
      background-image: url("./ovnis.png");
      background-size:cover;
      background-position:center;
    }
    .card {
      background:rgba(255,255,255,0.92);
      padding:35px 25px;
      border-radius:20px;
      text-align:center;
      max-width:400px;
      width:90%;
    }
    h1 { font-size:28px; color:#222; margin-bottom:15px; }
    p { color:#555; margin-bottom:30px; }
    #acessar {
      width:100%;
      padding:16px;
      border:none;
      border-radius:12px;
      background:#70c98b;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }
    #status {
      margin-top:15px;
      color:#555;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Painel FF111</h1>
    <p>👽 Painel FF111 mostra tudo sobre Operação Noite Oficial dos Ovnis no Brasil,Mostra 150 arquivos é áudios vazados É o Caso Secreto da Marry Los,Americana Loira com olhos de ET, Videos vazado disso Tudo, O Caso Parou o Brasil Na Epoca.</p>
    <button id="acessar">ACESSAR PAINEL</button>
    <div id="status"></div>
  </div>

  <!-- OneSignal -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "86f35d1d-9371-496b-ac30-f4310a09a01a",  // ← VOU TE ENSINAR A PEGAR
        allowLocalhostAsSecureOrigin: true,
      });
      document.getElementById("acessar").addEventListener("click", async function() {
        const perm = await OneSignal.Notifications.requestPermission();
        const status = document.getElementById("status");
        if (perm === "granted") {
          status.innerHTML = "✅ Cadastro concluído!";
          status.style.color = "#228B22";
        } else {
          status.innerHTML = "❌ Permissão negada.";
          status.style.color = "#228B22";
        }
      });
    });
  </script>
</body>
</html>
